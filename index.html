<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nescafe Booth Tracker</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin>
    </script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin>
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>
    <style>
        @keyframes apiMembara {
            0% {
                background-position: 0% 50%;
                box-shadow: inset 0 0 10px rgba(255, 0, 0, 0.8), 0 0 4px rgba(255, 69, 0, 0.6);
            }
            50% {
                background-position: 100% 50%;
                box-shadow: inset 0 0 16px rgba(255, 69, 0, 1), 0 0 10px rgba(255, 140, 0, 0.9);
            }
            100% {
                background-position: 0% 50%;
                box-shadow: inset 0 0 10px rgba(255, 0, 0, 0.8), 0 0 4px rgba(255, 69, 0, 0.6);
            }
        }

        .shift-api-long {
            background: linear-gradient(-45deg, #e11d48, #ea580c, #ca8a04, #e11d48) !important;
            background-size: 300% 300% !important;
            animation: apiMembara 1.5s ease infinite !important;
            color: #ffffff !important;
            border: 1px solid #9f1239 !important;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        }

        .shift-biru-pagi {
            background-color: #0284c7 !important;
            color: #ffffff !important;
            border-color: #0369a1 !important;
        }

        .shift-kuning-sore {
            background-color: #eab308 !important;
            color: #1e293b !important;
            border-color: #ca8a04 !important;
        }

        .shift-dongker-off {
            background-color: #0f172a !important;
            color: #ffffff !important;
            border-color: #1e293b !important;
        }

        .periode-tutup-buku {
            border-left: 4px solid #b45309 !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React

        const TARIF = {
            Pagi: 70000,
            Sore: 70000,
            Long: 140000,
            Libur: 0
        }

        const DATA_AWAL = {}

        const dapatkanDataLokal = (key, nilaiBawaan) => {
            try {
                const saved = localStorage.getItem(key)
                return saved ? JSON.parse(saved) : nilaiBawaan
            } catch (e) {
                return nilaiBawaan
            }
        }

        const simpanDataLokal = (key, data) => {
            try {
                localStorage.setItem(key, JSON.stringify(data))
            } catch (e) {}
        }

        function App() {
            const [dataShift, setDataShift] = useState(() => {
                return dapatkanDataLokal('nescafe_shifts_github', DATA_AWAL)
            })

            const [statusGaji, setStatusGaji] = useState(() => {
                return dapatkanDataLokal('nescafe_status_gaji_github', {})
            })

            const tanggalSekarang = new Date()
            const [tahunAktif, setTahunAktif] = useState(tanggalSekarang.getFullYear())
            const [bulanAktif, setBulanAktif] = useState(tanggalSekarang.getMonth())

            const [tabAktif, setTabAktif] = useState('kalender')

            const [tanggalPilihan, setTanggalPilihan] = useState(null)
            const [tipeShiftPilihan, setTipeShiftPilihan] = useState('Libur')
            const [catatanPilihan, setCatatanPilihan] = useState('')
            const [tampilkanModal, setTampilkanModal] = useState(false)
            const [tampilkanFilterModal, setTampilkanFilterModal] = useState(false)

            const [filterTahun, setFilterTahun] = useState(tanggalSekarang.getFullYear())
            const [filterBulanMulai, setFilterBulanMulai] = useState(tanggalSekarang.getMonth())
            const [filterBulanSelesai, setFilterBulanSelesai] = useState(tanggalSekarang.getMonth())

            const [tampilkanModalTahun, setTampilkanModalTahun] = useState(false)
            const [tampilkanModalBulanMulai, setTampilkanModalBulanMulai] = useState(false)
            const [tampilkanModalBulanSelesai, setTampilkanModalBulanSelesai] = useState(false)

            const [tempFilterTahun, setTempFilterTahun] = useState(tanggalSekarang.getFullYear())
            const [tempFilterBulanMulai, setTempFilterBulanMulai] = useState(tanggalSekarang.getMonth())
            const [tempFilterBulanSelesai, setTempFilterBulanSelesai] = useState(tanggalSekarang.getMonth())

            const [sudahTercatat, setSudahTercatat] = useState(false)
            const [tampilkanKonfirmasiHapus, setTampilkanKonfirmasiHapus] = useState(false)
            const [tampilkanKonfirmasiKosongkan, setTampilkanKonfirmasiKosongkan] = useState(false)

            const [tempBulan, setTempBulan] = useState(bulanAktif)
            const [tempTahun, setTempTahun] = useState(tahunAktif)

            const [notifikasi, setNotifikasi] = useState(null)

            const [tampilkanModalLaporan, setTampilkanModalLaporan] = useState(false)
            const [tipeLaporan, setTipeLaporan] = useState('tutupBuku')
            const [namaKaryawan, setNamaKaryawan] = useState(() => {
                return dapatkanDataLokal('nescafe_nama_karyawan_github', '')
            })

            useEffect(() => {
                simpanDataLokal('nescafe_shifts_github', dataShift)
            }, [dataShift])

            useEffect(() => {
                simpanDataLokal('nescafe_nama_karyawan_github', namaKaryawan)
            }, [namaKaryawan])

            useEffect(() => {
                simpanDataLokal('nescafe_status_gaji_github', statusGaji)
            }, [statusGaji])

            const pemicuNotifikasi = (pesan) => {
                setNotifikasi(pesan)
                setTimeout(() => {
                    setNotifikasi(null)
                }, 3000)
            }

            const daftarBulan = [
                "Januari", "Februari", "Maret", "April", "Mei", "Juni",
                "Juli", "Agustus", "September", "Oktober", "November", "Desember"
            ]

            const daftarTahun = [2025, 2026, 2027]

            const formatKeKey = (tahun, month, date) => {
                const b = String(month + 1).padStart(2, '0')
                const t = String(date).padStart(2, '0')
                return `${tahun}-${b}-${t}`
            }

            const geserKiri = () => {
                if (bulanAktif === 0) {
                    setBulanAktif(11)
                    setTahunAktif(prev => prev - 1)
                } else {
                    setBulanAktif(prev => prev - 1)
                }
            }

            const geserKanan = () => {
                if (bulanAktif === 11) {
                    setBulanAktif(0)
                    setTahunAktif(prev => prev + 1)
                } else {
                    setBulanAktif(prev => prev + 1)
                }
            }

            const jumlahHari = new Date(tahunAktif, bulanAktif + 1, 0).getDate()
            const hariPertama = new Date(tahunAktif, bulanAktif, 1).getDay()

            // PERBAIKAN: Fungsi untuk menentukan bulan gaji dari suatu tanggal
            // Tanggal 1-20 masuk ke bulan tersebut, tanggal 21 ke atas masuk ke bulan berikutnya
            const getBulanGaji = (tahun, bulan, tanggal) => {
                if (tanggal >= 21) {
                    // Tanggal 21 ke atas masuk ke bulan berikutnya
                    if (bulan === 11) {
                        return { tahun: tahun + 1, bulan: 0 }
                    } else {
                        return { tahun: tahun, bulan: bulan + 1 }
                    }
                } else {
                    // Tanggal 1-20 masuk ke bulan tersebut
                    return { tahun: tahun, bulan: bulan }
                }
            }

            // Fungsi untuk mendapatkan periode tutup buku (21 - 20)
            const getTutupBukuRange = (tahun, bulan) => {
                // Periode tutup buku: tanggal 21 bulan lalu - 20 bulan ini
                let bulanMulai = bulan - 1
                let tahunMulai = tahun
                if (bulanMulai < 0) {
                    bulanMulai = 11
                    tahunMulai = tahun - 1
                }
                const tglAwal = new Date(tahunMulai, bulanMulai, 21)
                const tglAkhir = new Date(tahun, bulan, 20)
                return { tglAwal, tglAkhir, bulanMulai, tahunMulai }
            }

            // PERBAIKAN: Hitung gaji bulanan dengan aturan tanggal 21 ke atas masuk bulan berikutnya
            const hitungGajiBulanan = (tahun, bulan) => {
                let total = 0
                let pagi = 0
                let sore = 0
                let long = 0
                let rincian = []

                // Hitung tanggal 1-20 dari bulan ini
                for (let tgl = 1; tgl <= 20; tgl++) {
                    const key = formatKeKey(tahun, bulan, tgl)
                    const shift = dataShift[key]
                    if (shift && shift.tipe !== 'Libur') {
                        const tarif = TARIF[shift.tipe] || 0
                        total += tarif
                        if (shift.tipe === 'Pagi') pagi++
                        if (shift.tipe === 'Sore') sore++
                        if (shift.tipe === 'Long') long++
                        rincian.push({
                            tanggal: tgl,
                            tipe: shift.tipe,
                            gaji: tarif,
                            catatan: shift.catatan,
                            bulanGaji: `${daftarBulan[bulan]} ${tahun}`
                        })
                    }
                }

                // Hitung tanggal 21 ke atas dari bulan sebelumnya (masuk ke bulan ini)
                let bulanSebelum = bulan - 1
                let tahunSebelum = tahun
                if (bulanSebelum < 0) {
                    bulanSebelum = 11
                    tahunSebelum = tahun - 1
                }

                const jlhHariBulanSebelum = new Date(tahunSebelum, bulanSebelum + 1, 0).getDate()
                for (let tgl = 21; tgl <= jlhHariBulanSebelum; tgl++) {
                    const key = formatKeKey(tahunSebelum, bulanSebelum, tgl)
                    const shift = dataShift[key]
                    if (shift && shift.tipe !== 'Libur') {
                        const tarif = TARIF[shift.tipe] || 0
                        total += tarif
                        if (shift.tipe === 'Pagi') pagi++
                        if (shift.tipe === 'Sore') sore++
                        if (shift.tipe === 'Long') long++
                        rincian.push({
                            tanggal: tgl,
                            tipe: shift.tipe,
                            gaji: tarif,
                            catatan: shift.catatan,
                            bulanGaji: `${daftarBulan[bulanSebelum]} ${tahunSebelum} (masuk ${daftarBulan[bulan]} ${tahun})`
                        })
                    }
                }

                return { total, pagi, sore, long, rincian }
            }

            // Hitung gaji untuk periode tutup buku (21 bulan lalu - 20 bulan ini)
            const hitungGajiTutupBuku = () => {
                const range = getTutupBukuRange(tahunAktif, bulanAktif)
                const { tglAwal, tglAkhir, bulanMulai, tahunMulai } = range

                let total = 0
                let pagi = 0
                let sore = 0
                let long = 0
                let libur = 0
                let totalHariPeriode = 0
                let rincian = []

                let loop = new Date(tglAwal)

                while (loop <= tglAkhir) {
                    totalHariPeriode++
                    const key = formatKeKey(loop.getFullYear(), loop.getMonth(), loop.getDate())
                    const shift = dataShift[key]
                    if (shift) {
                        if (shift.tipe !== 'Libur') {
                            const tarif = TARIF[shift.tipe] || 0
                            total += tarif
                            if (shift.tipe === 'Pagi') pagi++
                            if (shift.tipe === 'Sore') sore++
                            if (shift.tipe === 'Long') long++
                            rincian.push({
                                tanggal: loop.getDate(),
                                tipe: shift.tipe,
                                gaji: tarif,
                                catatan: shift.catatan,
                                bulanAsal: `${daftarBulan[loop.getMonth()]} ${loop.getFullYear()}`
                            })
                        } else {
                            libur++
                        }
                    }
                    loop.setDate(loop.getDate() + 1)
                }

                const tglGajian = new Date(tahunAktif, bulanAktif, 25)
                const targetGajiNormal = totalHariPeriode * 70000
                const selisihGaji = total - targetGajiNormal
                const kurangShift = total < targetGajiNormal ? Math.ceil((targetGajiNormal - total) / 70000) : 0
                const persentaseTarget = targetGajiNormal > 0 ? Math.min(100, Math.round((total / targetGajiNormal) * 100)) : 0

                return {
                    total,
                    pagi,
                    sore,
                    long,
                    libur,
                    totalHariPeriode,
                    targetGajiNormal,
                    selisihGaji,
                    kurangShift,
                    persentaseTarget,
                    rincian,
                    tglMulai: tglAwal,
                    tglAkhir: tglAkhir,
                    tglGajian: tglGajian,
                    labelPeriode: `21 ${daftarBulan[bulanMulai]} ${tahunMulai} - 20 ${daftarBulan[bulanAktif]} ${tahunAktif}`,
                    labelGajian: `25 ${daftarBulan[bulanAktif]} ${tahunAktif}`,
                    keyGajiPeriod: `${tahunAktif}-${String(bulanAktif + 1).padStart(2, '0')}`
                }
            }

            const hitungAkumulasiSemua = () => {
                let pagi = 0
                let sore = 0
                let long = 0
                let libur = 0
                let total = 0
                Object.keys(dataShift).forEach(key => {
                    const item = dataShift[key]
                    if (item) {
                        if (item.tipe !== 'Libur') {
                            const tarif = TARIF[item.tipe] || 0
                            total += tarif
                            if (item.tipe === 'Pagi') pagi++
                            if (item.tipe === 'Sore') sore++
                            if (item.tipe === 'Long') long++
                        } else {
                            libur++
                        }
                    }
                })
                const hutangLiburAllTime = libur - long
                return { total, pagi, sore, long, libur, hutangLiburAllTime }
            }

            // Hitung gaji range dengan aturan Tutup Buku (21 bulan lalu - 20 bulan ini) & Evaluasi Ganti Libur
            const hitungGajiRangeBulan = (tahun, bulanMulai, bulanSelesai) => {
                let total = 0
                let pagi = 0
                let sore = 0
                let long = 0
                let libur = 0
                let totalHariPeriode = 0

                for (let bln = bulanMulai; bln <= bulanSelesai; bln++) {
                    const range = getTutupBukuRange(tahun, bln)
                    let loop = new Date(range.tglAwal)
                    while (loop <= range.tglAkhir) {
                        totalHariPeriode++
                        const key = formatKeKey(loop.getFullYear(), loop.getMonth(), loop.getDate())
                        const shift = dataShift[key]
                        if (shift) {
                            if (shift.tipe !== 'Libur') {
                                const tarif = TARIF[shift.tipe] || 0
                                total += tarif
                                if (shift.tipe === 'Pagi') pagi++
                                if (shift.tipe === 'Sore') sore++
                                if (shift.tipe === 'Long') long++
                            } else {
                                libur++
                            }
                        }
                        loop.setDate(loop.getDate() + 1)
                    }
                }

                const targetGajiNormal = totalHariPeriode * 70000
                const selisihGaji = total - targetGajiNormal
                const kurangShift = total < targetGajiNormal ? Math.ceil((targetGajiNormal - total) / 70000) : 0
                const persentaseTarget = targetGajiNormal > 0 ? Math.min(100, Math.round((total / targetGajiNormal) * 100)) : 0

                return { total, pagi, sore, long, libur, totalHariPeriode, targetGajiNormal, selisihGaji, kurangShift, persentaseTarget }
            }

            const murni = hitungGajiBulanan(tahunAktif, bulanAktif)
            const tutupBuku = hitungGajiTutupBuku()
            const akumulasiSemua = hitungAkumulasiSemua()
            const akumulasiFilter = hitungGajiRangeBulan(filterTahun, filterBulanMulai, filterBulanSelesai)

            const jlhHariBulanAktif = new Date(tahunAktif, bulanAktif + 1, 0).getDate()
            let countShiftNextMonth = 0
            let totalGajiNextMonth = 0
            for (let tgl = 21; tgl <= jlhHariBulanAktif; tgl++) {
                const key = formatKeKey(tahunAktif, bulanAktif, tgl)
                const shift = dataShift[key]
                if (shift && shift.tipe !== 'Libur') {
                    countShiftNextMonth++
                    totalGajiNextMonth += (TARIF[shift.tipe] || 0)
                }
            }
            const bulanBerikutnyaIdx = bulanAktif === 11 ? 0 : bulanAktif + 1
            const tahunBerikutnya = bulanAktif === 11 ? tahunAktif + 1 : tahunAktif
            const bulanSebelumIdx = bulanAktif === 0 ? 11 : bulanAktif - 1
            const tahunSebelum = bulanAktif === 0 ? tahunAktif - 1 : tahunAktif

            const keyGajiPeriod = tutupBuku.keyGajiPeriod
            const gajianLunas = statusGaji[keyGajiPeriod] || false

            const bukaFormShift = (tanggal) => {
                const key = formatKeKey(tahunAktif, bulanAktif, tanggal)
                const shiftAda = dataShift[key]
                setTanggalPilihan(tanggal)
                setTipeShiftPilihan(shiftAda ? shiftAda.tipe : 'Libur')
                setCatatanPilihan(shiftAda ? (shiftAda.catatan || '') : '')

                const statusTercatat = shiftAda && shiftAda.tipe !== 'Libur'
                setSudahTercatat(statusTercatat)
                setTampilkanKonfirmasiHapus(false)

                setTampilkanModal(true)
            }

            const simpanShift = () => {
                const key = formatKeKey(tahunAktif, bulanAktif, tanggalPilihan)
                const dataBaru = { ...dataShift }

                dataBaru[key] = {
                    tipe: tipeShiftPilihan,
                    catatan: catatanPilihan
                }

                setDataShift(dataBaru)
                setTampilkanModal(false)
                pemicuNotifikasi(`Shift tanggal ${tanggalPilihan} berhasil disimpan`)
            }

            const hapusShift = () => {
                const key = formatKeKey(tahunAktif, bulanAktif, tanggalPilihan)
                const dataBaru = { ...dataShift }

                if (dataBaru[key]) {
                    delete dataBaru[key]
                    setDataShift(dataBaru)
                }

                setTampilkanModal(false)
                setTampilkanKonfirmasiHapus(false)
                pemicuNotifikasi(`Data shift tanggal ${tanggalPilihan} telah dihapus`)
            }

            const muatDataUlang = () => {
                setDataShift(DATA_AWAL)
                setTampilkanKonfirmasiKosongkan(false)
                pemicuNotifikasi("Semua jadwal kerja Anda berhasil dikosongkan!")
            }

            const bukaModalFilter = () => {
                setTempBulan(bulanAktif)
                setTempTahun(tahunAktif)
                setTampilkanFilterModal(true)
            }

            const simpanFilter = () => {
                setBulanAktif(tempBulan)
                setTahunAktif(tempTahun)
                setTampilkanFilterModal(false)
            }

            const bukaModalTahun = () => {
                setTempFilterTahun(filterTahun)
                setTampilkanModalTahun(true)
            }

            const pilihTahun = (tahun) => {
                setFilterTahun(tahun)
                setTampilkanModalTahun(false)
                pemicuNotifikasi(`Tahun filter: ${tahun}`)
            }

            const bukaModalBulanMulai = () => {
                setTempFilterBulanMulai(filterBulanMulai)
                setTampilkanModalBulanMulai(true)
            }

            const pilihBulanMulai = (bulan) => {
                if (bulan > filterBulanSelesai) {
                    pemicuNotifikasi("Bulan mulai tidak boleh lebih besar dari bulan selesai!")
                    return
                }
                setFilterBulanMulai(bulan)
                setTampilkanModalBulanMulai(false)
                pemicuNotifikasi(`Bulan mulai: ${daftarBulan[bulan]}`)
            }

            const bukaModalBulanSelesai = () => {
                setTempFilterBulanSelesai(filterBulanSelesai)
                setTampilkanModalBulanSelesai(true)
            }

            const pilihBulanSelesai = (bulan) => {
                if (bulan < filterBulanMulai) {
                    pemicuNotifikasi("Bulan selesai tidak boleh lebih kecil dari bulan mulai!")
                    return
                }
                setFilterBulanSelesai(bulan)
                setTampilkanModalBulanSelesai(false)
                pemicuNotifikasi(`Bulan selesai: ${daftarBulan[bulan]}`)
            }

            const resetFilter = () => {
                const sekarang = new Date()
                setFilterTahun(sekarang.getFullYear())
                setFilterBulanMulai(sekarang.getMonth())
                setFilterBulanSelesai(sekarang.getMonth())
                pemicuNotifikasi(`Filter direset ke bulan sekarang: ${daftarBulan[sekarang.getMonth()]} ${sekarang.getFullYear()}`)
            }

            const eksporData = () => {
                try {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataShift))
                    const downloadAnchor = document.createElement('a')
                    downloadAnchor.setAttribute("href", dataStr)
                    downloadAnchor.setAttribute("download", `cadangan_nescafe_tracker_${new Date().toISOString().split('T')[0]}.json`)
                    document.body.appendChild(downloadAnchor)
                    downloadAnchor.click()
                    downloadAnchor.remove()
                    pemicuNotifikasi("Cadangan JSON berhasil diunduh!")
                } catch (e) {
                    pemicuNotifikasi("Gagal mengekspor data cadangan.")
                }
            }

            const imporData = (event) => {
                const file = event.target.files[0]
                if (!file) return
                const reader = new FileReader()
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result)
                        if (typeof parsed === 'object' && parsed !== null) {
                            setDataShift(parsed)
                            pemicuNotifikasi("Data cadangan berhasil dipasang!")
                        } else {
                            pemicuNotifikasi("Format file cadangan salah!")
                        }
                    } catch (err) {
                        pemicuNotifikasi("Gagal membaca file cadangan!")
                    }
                }
                reader.readAsText(file)
            }

            const bukaModalLaporan = (tipe) => {
                setTipeLaporan(tipe)
                setTampilkanModalLaporan(true)
            }

            const dapatkanTeksLaporan = () => {
                const namaText = namaKaryawan.trim() ? namaKaryawan : '[Nama Anda]'
                const statusText = gajianLunas ? 'LUNAS (Sudah Diterima)' : 'BELUM CAIR'
                if (tipeLaporan === 'tutupBuku') {
                    let rincianText = tutupBuku.rincian.map(item => 
                        `  - ${item.tanggal} ${item.bulanAsal}: ${item.tipe} (Rp ${item.gaji.toLocaleString('id-ID')})${item.catatan ? ' - ' + item.catatan : ''}`
                    ).join('\n')
                    
                    let statusGantiLiburText = ''
                    if (tutupBuku.selisihGaji >= 0) {
                        statusGantiLiburText = tutupBuku.selisihGaji > 0 ? `Surplus (+Rp ${tutupBuku.selisihGaji.toLocaleString('id-ID')})` : 'Normal / Terbayar Penuh'
                    } else {
                        statusGantiLiburText = `Kurang ${tutupBuku.kurangShift}x Long Shift (Defisit Rp ${Math.abs(tutupBuku.selisihGaji).toLocaleString('id-ID')})`
                    }

                    return `Laporan Gaji Nescafe - Sistem Tutup Buku
        Nama: ${namaText}
        Periode: ${tutupBuku.labelPeriode} (Gajian: ${tutupBuku.labelGajian})
        Status Pembayaran: ${statusText}

        Analisis Ganti Libur (Gali-Tutup):
        - Target Gaji Normal (${tutupBuku.totalHariPeriode} Hari): Rp ${tutupBuku.targetGajiNormal.toLocaleString('id-ID')}
        - Upah Terkumpul: Rp ${tutupBuku.total.toLocaleString('id-ID')}
        - Status Ganti Libur: ${statusGantiLiburText}

        Rincian Kerja:
        ${rincianText || 'Tidak ada shift kerja terdaftar'}

        Rekap Shift Periode:

                                                            <td className="p-2 border"><span className="bg-yellow-400 text-stone-900 px-2 py-0.5 rounded text-[10px] font-bold">Sore</span></td>
                                                            <td className="p-2 border">Rp 70.000</td>
                                                            <td className="p-2 border">Masuk x Rp 70.000</td>
                                                            <td className="p-2 border">{akumulasiSemua.sore}x</td>
                                                            <td className="p-2 border font-bold">Rp {(akumulasiSemua.sore * 70000).toLocaleString('id-ID')}</td>
                                                        </tr>
                                                        <tr>
                                                            <td className="p-2 border"><span className="bg-gradient-to-r from-red-600 to-orange-500 text-white px-2 py-0.5 rounded text-[10px] font-bold">Long Shift</span></td>
                                                            <td className="p-2 border">Rp 140.000</td>
                                                            <td className="p-2 border">Masuk x (Rp 70.000 x 2)</td>
                                                            <td className="p-2 border">{akumulasiSemua.long}x</td>
                                                            <td className="p-2 border font-bold">Rp {(akumulasiSemua.long * 140000).toLocaleString('id-ID')}</td>
                                                        </tr>
                                                        <tr>
                                                            <td className="p-2 border"><span className="bg-slate-900 text-white px-2 py-0.5 rounded text-[10px] font-bold">Libur / Off</span></td>
                                                            <td className="p-2 border">Rp 0</td>
                                                            <td className="p-2 border">Potong 1 Shift Normal (-70k)</td>
                                                            <td className="p-2 border">{akumulasiSemua.libur}x</td>
                                                            <td className="p-2 border font-bold text-slate-500">Rp 0</td>
                                                        </tr>
                                                        <tr className="bg-amber-50/70 font-semibold text-amber-950">
                                                            <td className="p-2 border" colSpan="3">
                                                                ⚖️ <strong>Status Gali-Tutup Libur (All-Time)</strong>: {akumulasiSemua.libur} Libur vs {akumulasiSemua.long} Long Shift
                                                            </td>
                                                            <td className="p-2 border" colSpan="2">
                                                                {akumulasiSemua.hutangLiburAllTime <= 0 ? (
                                                                    <span className="text-emerald-700 font-bold">🟢 Hutang Libur Lunas</span>
                                                                ) : (
                                                                    <span className="text-amber-800 font-bold">🚨 Masih Hutang {akumulasiSemua.hutangLiburAllTime} Long Shift</span>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {tampilkanFilterModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl border border-stone-200">
                                <div className="bg-amber-950 text-white p-4">
                                    <h5 className="font-bold text-base m-0">Menu Filter Kalender</h5>
                                </div>

                                <div className="p-4">
                                    <div className="mb-4">
                                        <label className="block text-[10px] font-bold text-stone-400 uppercase tracking-wider mb-2">1. Pilih Tahun</label>
                                        <div className="grid grid-cols-3 gap-2">
                                            {daftarTahun.map((thn) => (
                                                <button
                                                    key={thn}
                                                    type="button"
                                                    onClick={() => setTempTahun(thn)}
                                                    className={`py-2 text-xs font-bold rounded-xl transition ${tempTahun === thn ? 'bg-amber-950 text-white' : 'bg-stone-100 hover:bg-stone-200 text-stone-700'}`}
                                                >
                                                    {thn}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-bold text-stone-400 uppercase tracking-wider mb-2">2. Pilih Bulan</label>
                                        <div className="grid grid-cols-3 gap-2">
                                            {daftarBulan.map((bln, idx) => (
                                                <button
                                                    key={idx}
                                                    type="button"
                                                    onClick={() => setTempBulan(idx)}
                                                    className={`py-2 text-xs font-semibold rounded-xl transition ${tempBulan === idx ? 'bg-amber-800 text-white' : 'bg-stone-50 hover:bg-stone-150 border border-stone-200 text-stone-700'}`}
                                                >
                                                    {bln}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-stone-50 px-4 py-3 flex gap-2 border-t border-stone-150 justify-end">
                                    <button
                                        onClick={() => setTampilkanFilterModal(false)}
                                        className="px-4 py-2 bg-stone-200 text-stone-700 hover:bg-stone-300 rounded-xl text-xs font-bold transition"
                                    >
                                        Batal
                                    </button>
                                    <button
                                        onClick={simpanFilter}
                                        className="px-4 py-2 bg-amber-950 hover:bg-amber-900 text-white rounded-xl text-xs font-bold transition"
                                    >
                                        Terapkan
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {tampilkanModalTahun && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl border border-stone-200">
                                <div className="bg-amber-950 text-white p-4">
                                    <h5 className="font-bold text-base m-0">Pilih Tahun Filter</h5>
                                    <p className="text-xs text-amber-200 m-0">Pilih tahun untuk filter range</p>
                                </div>

                                <div className="p-4">
                                    <div className="grid grid-cols-3 gap-3">
                                        {daftarTahun.map((thn) => (
                                            <button
                                                key={thn}
                                                onClick={() => pilihTahun(thn)}
                                                className={`py-4 px-2 text-base font-bold rounded-xl transition ${filterTahun === thn ?
                                                        'bg-amber-950 text-white ring-2 ring-amber-500' :
                                                        'bg-stone-100 hover:bg-stone-200 text-stone-700'
                                                    }`}
                                            >
                                                {thn}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-stone-50 px-4 py-3 flex gap-2 border-t border-stone-150 justify-end">
                                    <button
                                        onClick={() => setTampilkanModalTahun(false)}
                                        className="px-4 py-2 bg-stone-200 text-stone-700 hover:bg-stone-300 rounded-xl text-xs font-bold transition"
                                    >
                                        Batal
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {tampilkanModalBulanMulai && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl border border-stone-200">
                                <div className="bg-blue-700 text-white p-4">
                                    <h5 className="font-bold text-base m-0">Pilih Bulan Mulai</h5>
                                    <p className="text-xs text-blue-200 m-0">Tahun: {filterTahun}</p>
                                </div>

                                <div className="p-4">
                                    <div className="grid grid-cols-3 gap-2">
                                        {daftarBulan.map((bln, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => pilihBulanMulai(idx)}
                                                className={`py-2.5 px-2 text-xs font-semibold rounded-xl transition ${filterBulanMulai === idx ?
                                                        'bg-blue-600 text-white ring-2 ring-blue-400' :
                                                        'bg-stone-50 hover:bg-stone-150 border border-stone-200 text-stone-700'
                                                    } ${idx > filterBulanSelesai ? 'opacity-40 cursor-not-allowed' : ''}`}
                                                disabled={idx > filterBulanSelesai}
                                            >
                                                {bln}
                                            </button>
                                        ))}
                                    </div>
                                    {filterBulanMulai > filterBulanSelesai && (
                                        <div className="mt-3 text-xs text-red-600 text-center">
                                            ⚠️ Bulan mulai harus ≤ bulan selesai
                                        </div>
                                    )}
                                </div>

                                <div className="bg-stone-50 px-4 py-3 flex gap-2 border-t border-stone-150 justify-end">
                                    <button
                                        onClick={() => setTampilkanModalBulanMulai(false)}
                                        className="px-4 py-2 bg-stone-200 text-stone-700 hover:bg-stone-300 rounded-xl text-xs font-bold transition"
                                    >
                                        Batal
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {tampilkanModalBulanSelesai && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl border border-stone-200">
                                <div className="bg-green-700 text-white p-4">
                                    <h5 className="font-bold text-base m-0">Pilih Bulan Selesai</h5>
                                    <p className="text-xs text-green-200 m-0">Tahun: {filterTahun} | Mulai: {daftarBulan[filterBulanMulai]}</p>
                                </div>

                                <div className="p-4">
                                    <div className="grid grid-cols-3 gap-2">
                                        {daftarBulan.map((bln, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => pilihBulanSelesai(idx)}
                                                className={`py-2.5 px-2 text-xs font-semibold rounded-xl transition ${filterBulanSelesai === idx ?
                                                        'bg-green-600 text-white ring-2 ring-green-400' :
                                                        'bg-stone-50 hover:bg-stone-150 border border-stone-200 text-stone-700'
                                                    } ${idx < filterBulanMulai ? 'opacity-40 cursor-not-allowed' : ''}`}
                                                disabled={idx < filterBulanMulai}
                                            >
                                                {bln}
                                            </button>
                                        ))}
                                    </div>
                                    {filterBulanSelesai < filterBulanMulai && (
                                        <div className="mt-3 text-xs text-red-600 text-center">
                                            ⚠️ Bulan selesai harus ≥ bulan mulai
                                        </div>
                                    )}
                                </div>

                                <div className="bg-stone-50 px-4 py-3 flex gap-2 border-t border-stone-150 justify-end">
                                    <button
                                        onClick={() => setTampilkanModalBulanSelesai(false)}
                                        className="px-4 py-2 bg-stone-200 text-stone-700 hover:bg-stone-300 rounded-xl text-xs font-bold transition"
                                    >
                                        Batal
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {tampilkanModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl border border-stone-200">
                                <div className="bg-amber-950 text-white p-4 flex justify-between items-start">
                                    <div>
                                        <h5 className="font-bold text-base m-0">Ubah Jadwal Kerja</h5>
                                        <p className="m-0 text-amber-200 text-xs mt-1">
                                            Tanggal: {tanggalPilihan} {daftarBulan[bulanAktif]} {tahunAktif}
                                            {tanggalPilihan >= 21 && (
                                                <span className="block text-amber-300/70 text-[9px]">
                                                    → masuk gaji {bulanAktif === 11 ? daftarBulan[0] : daftarBulan[bulanAktif+1]} {bulanAktif === 11 ? tahunAktif+1 : tahunAktif}
                                                </span>
                                            )}
                                        </p>
                                    </div>
                                    <button
                                        onClick={() => setTampilkanModal(false)}
                                        className="text-white hover:text-amber-200 text-xl font-bold focus:outline-none"
                                    >
                                        &times;
                                    </button>
                                </div>

                                <div className="p-4 space-y-4">
                                    {tampilkanKonfirmasiHapus ? (
                                        <div className="bg-red-50 p-4 rounded-xl border border-red-200 text-center space-y-3">
                                            <p className="text-xs font-bold text-red-800 m-0">Apakah Anda yakin ingin menghapus jadwal kerja pada tanggal ini?</p>
                                            <div className="flex gap-2 justify-center">
                                                <button
                                                    onClick={() => setTampilkanKonfirmasiHapus(false)}
                                                    className="px-3 py-1.5 bg-stone-200 text-stone-700 font-bold text-[11px] rounded-lg"
                                                >
                                                    Batal
                                                </button>
                                                <button
                                                    onClick={hapusShift}
                                                    className="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white font-bold text-[11px] rounded-lg transition"
                                                >
                                                    Ya, Hapus
                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        <>
                                            <div>
                                                <label className="block text-[10px] font-bold text-stone-400 uppercase tracking-wider mb-2">
                                                    Pilih Jenis Shift Kerja
                                                </label>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <button
                                                        onClick={() => setTipeShiftPilihan('Pagi')}
                                                        className={`py-2.5 px-2 text-xs font-bold rounded-xl border transition ${tipeShiftPilihan === 'Pagi' ? 'bg-blue-600 border-blue-700 text-white shadow-sm' : 'bg-white border-stone-200 hover:bg-stone-50'}`}
                                                    >
                                                        Pagi (70k)
                                                    </button>
                                                    <button
                                                        onClick={() => setTipeShiftPilihan('Sore')}
                                                        className={`py-2.5 px-2 text-xs font-bold rounded-xl border transition ${tipeShiftPilihan === 'Sore' ? 'bg-yellow-400 border-yellow-500 text-stone-900 shadow-sm' : 'bg-white border-stone-200 hover:bg-stone-50'}`}
                                                    >
                                                        Sore (70k)
                                                    </button>
                                                    <button
                                                        onClick={() => setTipeShiftPilihan('Long')}
                                                        className={`col-span-2 py-2.5 px-2 text-xs font-bold rounded-xl border transition ${tipeShiftPilihan === 'Long' ? 'bg-gradient-to-r from-red-600 to-orange-500 border-red-700 text-white shadow-sm' : 'bg-white border-stone-200 hover:bg-stone-50'}`}
                                                    >
                                                        Long Shift (140k)
                                                    </button>

                                                    <button
                                                        onClick={() => setTipeShiftPilihan('Libur')}
                                                        className={`col-span-2 py-2.5 px-2 text-xs font-bold rounded-xl border transition ${tipeShiftPilihan === 'Libur' ? 'bg-slate-900 border-slate-950 text-white shadow-sm' : 'bg-white border-stone-200 hover:bg-stone-50'}`}
                                                    >
                                                        Libur / Off
                                                    </button>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-[10px] font-bold text-stone-400 uppercase tracking-wider mb-1">Catatan Tambahan</label>
                                                <input
                                                    type="text"
                                                    value={catatanPilihan}
                                                    onChange={(e) => setCatatanPilihan(e.target.value)}
                                                    placeholder="Masukkan catatan jika ada"
                                                    className="w-full border border-stone-300 p-2 text-xs rounded-xl outline-none"
                                                />
                                            </div>
                                        </>
                                    )}
                                </div>

                                <div className="bg-stone-50 px-4 py-3 flex gap-2 border-t border-stone-150 justify-between items-center">
                                    <div>
                                        {sudahTercatat && !tampilkanKonfirmasiHapus && (
                                            <button
                                                onClick={() => setTampilkanKonfirmasiHapus(true)}
                                                className="text-red-600 hover:text-red-800 text-xs font-bold transition focus:outline-none"
                                            >
                                                Hapus Shift
                                            </button>
                                        )}
                                    </div>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => setTampilkanModal(false)}
                                            className="px-4 py-2 bg-stone-200 hover:bg-stone-300 text-stone-700 text-xs font-bold rounded-xl"
                                        >
                                            Batal
                                        </button>
                                        {!tampilkanKonfirmasiHapus && (
                                            <button
                                                onClick={simpanShift}
                                                className="px-4 py-2 bg-amber-950 hover:bg-amber-900 text-white text-xs font-bold rounded-xl shadow-sm"
                                            >
                                                Simpan
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {tampilkanModalLaporan && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl border border-stone-200">
                                <div className="bg-amber-950 text-white p-4">
                                    <h5 className="font-bold text-base m-0">Bagikan Laporan Kerja</h5>
                                    <p className="m-0 text-amber-200 text-xs mt-1">Siap dikirim ke admin lewat WhatsApp</p>
                                </div>

                                <div className="p-4 space-y-4">
                                    <div>
                                        <label className="block text-[10px] font-bold text-stone-400 uppercase tracking-wider mb-1">Nama Barista (Anda)</label>
                                        <input
                                            type="text"
                                            value={namaKaryawan}
                                            onChange={(e) => setNamaKaryawan(e.target.value)}
                                            placeholder="Masukkan nama Anda"
                                            className="w-full border border-stone-300 p-2 text-xs rounded-xl outline-none text-stone-850"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-bold text-stone-400 uppercase tracking-wider mb-1">Pilih Jenis Laporan</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            <button
                                                onClick={() => setTipeLaporan('tutupBuku')}
                                                className={`py-2 text-[11px] font-bold rounded-lg border transition ${tipeLaporan === 'tutupBuku' ? 'bg-amber-950 text-white border-amber-950 shadow-sm' : 'bg-stone-50 text-stone-700 border-stone-200 hover:bg-stone-100'}`}
                                            >
                                                Sistem Tutup Buku
                                            </button>
                                            <button
                                                onClick={() => setTipeLaporan('murni')}
                                                className={`py-2 text-[11px] font-bold rounded-lg border transition ${tipeLaporan === 'murni' ? 'bg-amber-950 text-white border-amber-950 shadow-sm' : 'bg-stone-50 text-stone-700 border-stone-200 hover:bg-stone-100'}`}
                                            >
                                                Bulanan (1-20 + 21 ke atas)
                                            </button>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-bold text-stone-400 uppercase tracking-wider mb-1">Pratinjau Pesan Laporan</label>
                                        <textarea
                                            readOnly
                                            value={dapatkanTeksLaporan()}
                                            className="w-full h-36 bg-stone-50 border border-stone-200 p-2.5 text-[10px] rounded-xl font-mono text-stone-600 outline-none resize-none"
                                        />
                                    </div>
                                </div>

                                <div className="bg-stone-50 px-4 py-3 flex gap-2 border-t border-stone-150 justify-between items-center">
                                    <button
                                        onClick={salinTeksKeClipboard}
                                        className="px-3 py-2 bg-stone-200 hover:bg-stone-300 text-stone-700 text-xs font-bold rounded-xl flex items-center gap-1.5 transition"
                                    >
                                        Salin Teks
                                    </button>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => setTampilkanModalLaporan(false)}
                                            className="px-4 py-2 bg-stone-200 hover:bg-stone-300 text-stone-750 text-xs font-bold rounded-xl focus:outline-none"
                                        >
                                            Batal
                                        </button>
                                        <button
                                            onClick={() => {
                                                const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(dapatkanTeksLaporan())}`
                                                window.open(url, '_blank')
                                                pemicuNotifikasi("Membuka WhatsApp...")
                                            }}
                                            className="px-4 py-2 text-white text-xs font-bold rounded-xl flex items-center gap-1.5 shadow-sm transition focus:outline-none"
                                            style={{ backgroundColor: '#059669' }}
                                        >
                                            Kirim WA
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {tampilkanKonfirmasiKosongkan && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl border border-stone-200">
                                <div className="bg-red-950 text-white p-4">
                                    <h5 className="font-bold text-base m-0">Kosongkan Semua Data?</h5>
                                </div>
                                <div className="p-4 space-y-3">
                                    <p className="text-xs text-stone-600 m-0 leading-relaxed">
                                        Tindakan ini akan menghapus seluruh data jadwal kerja dan riwayat gaji yang tersimpan pada aplikasi secara permanen.
                                    </p>
                                    <p className="text-xs font-bold text-red-700 m-0">
                                        Apakah Anda sangat yakin ingin melanjutkan?
                                    </p>
                                </div>
                                <div className="bg-stone-50 px-4 py-3 flex gap-2 border-t border-stone-150 justify-end">
                                    <button
                                        onClick={() => setTampilkanKonfirmasiKosongkan(false)}
                                        className="px-4 py-2 bg-stone-200 hover:bg-stone-300 text-stone-700 text-xs font-bold rounded-xl"
                                    >
                                        Batal
                                    </button>
                                    <button
                                        onClick={muatDataUlang}
                                        className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-xl shadow-sm transition"
                                    >
                                        Ya, Hapus Semua
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            )
        }

        const container = document.getElementById('root')
        const root = ReactDOM.createRoot(container)
        root.render(<App />)
    </script>
</body>
</html>
